{{- $backend := printf "%s:%d" (include "mdnest.backend.fullname" .) (int .Values.backend.service.port) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mdnest.frontend.fullname" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ws {
            proxy_pass http://{{ $backend }}/api/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout {{ .Values.frontend.wsTimeoutSeconds }}s;
            proxy_send_timeout {{ .Values.frontend.wsTimeoutSeconds }}s;
        }

        location /api/ {
            proxy_pass http://{{ $backend }}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HTML — never cache (so the browser always discovers new JS/CSS hashes)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
