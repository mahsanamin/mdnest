{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mdnest.serviceAccountName" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
