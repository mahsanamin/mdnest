{{- include "mdnest.validateSupported" . -}}
{{- /*
Chart-managed Secret. Holds only the credentials whose *existingSecret* option
is empty. App password + JWT secret are generated once and preserved across
upgrades via a lookup, so rotating them is an explicit action (never silent).
*/ -}}
{{- $needApp := not .Values.auth.existingSecret -}}
{{- $needPg := and (eq .Values.auth.mode "multi") (not .Values.postgres.existingSecret) -}}
{{- $needRedis := and .Values.collab.redis.url (not .Values.collab.redis.existingSecret) -}}
{{- $needSso := and .Values.sso.enabled (not .Values.sso.existingSecret) -}}
{{- if or $needApp $needPg $needRedis $needSso -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "mdnest.appSecretName" .)) -}}
{{- $existingData := (default (dict) (get $existing "data")) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mdnest.appSecretName" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if $needApp }}
  {{- $jwt := .Values.auth.jwtSecret -}}
  {{- if not $jwt -}}{{- $jwt = (get $existingData "MDNEST_JWT_SECRET" | default (randAlphaNum 48 | b64enc) | b64dec) -}}{{- end }}
  MDNEST_JWT_SECRET: {{ $jwt | b64enc | quote }}
  {{- $pwd := .Values.auth.password -}}
  {{- if not $pwd -}}{{- $pwd = (get $existingData "MDNEST_PASSWORD" | default (randAlphaNum 24 | b64enc) | b64dec) -}}{{- end }}
  MDNEST_PASSWORD: {{ $pwd | b64enc | quote }}
  {{- end }}
  {{- if $needPg }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required when auth.mode=multi and postgres.existingSecret is empty" .Values.postgres.password | b64enc | quote }}
  {{- end }}
  {{- if $needRedis }}
  REDIS_URL: {{ .Values.collab.redis.url | b64enc | quote }}
  {{- end }}
  {{- if $needSso }}
  SSO_CLIENT_SECRET: {{ required "sso.clientSecret is required when sso.enabled=true and sso.existingSecret is empty" .Values.sso.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
