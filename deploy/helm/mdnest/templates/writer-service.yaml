{{- if eq (include "mdnest.gitNativeHA" .) "true" }}
{{/*
Headless Service that governs the writer StatefulSet (stable network identity)
and is the in-cluster target for app replicas proxying attachment reads to the
writer. It intentionally does NOT carry component: backend, so the user-facing
backend Service never routes traffic to the writer.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mdnest.writer.headlessName" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: writer
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mdnest.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: writer
{{- end }}
