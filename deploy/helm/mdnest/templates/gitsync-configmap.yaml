{{- if .Values.gitSync.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mdnest.gitsync.fullname" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: git-sync
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  sync.sh: |-
{{ .Files.Get "files/sync.sh" | indent 4 }}
{{- end }}
