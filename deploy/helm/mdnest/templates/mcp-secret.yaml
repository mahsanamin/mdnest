{{- $needToken := and (eq .Values.mcp.auth.mode "bearer") (not .Values.mcp.auth.existingSecret) .Values.mcp.auth.token -}}
{{- $needOAuth := and (eq .Values.mcp.auth.mode "oauth") (not .Values.mcp.oauth.secret.existingSecret) .Values.mcp.oauth.secret.value -}}
{{- if and .Values.mcp.enabled (or $needToken $needOAuth) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mdnest.mcp.secretName" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  {{- if $needToken }}
  token: {{ .Values.mcp.auth.token | quote }}
  {{- end }}
  {{- if $needOAuth }}
  oauth-secret: {{ .Values.mcp.oauth.secret.value | quote }}
  {{- end }}
{{- end }}
