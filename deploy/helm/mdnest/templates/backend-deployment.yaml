{{- include "mdnest.validateHA" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mdnest.backend.fullname" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.backend.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "mdnest.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mdnest.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mdnest.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.namespaces }}
      initContainers:
        # Ensure the configured top-level namespaces (note folders) exist under
        # /data/notes. Idempotent and self-healing on every (re)start. When the
        # list is empty (default) this init container is not rendered, so the
        # existing behavior is unchanged.
        - name: provision-namespaces
          image: {{ $.Values.backend.namespaceInitImage }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              for ns in {{ range . }}{{ . | quote }} {{ end }}; do
                echo "ensuring namespace: ${ns}"
                mkdir -p "/data/notes/${ns}"
              done
          {{- with $.Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: notes
              mountPath: /data/notes
      {{- end }}
      containers:
        - name: backend
          image: {{ include "mdnest.backend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "mdnest.envConfigName" . }}
          env:
            - name: MDNEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.auth.existingSecret }}
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKeys.password }}
                  {{- else }}
                  name: {{ include "mdnest.appSecretName" . }}
                  key: MDNEST_PASSWORD
                  {{- end }}
            - name: MDNEST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.auth.existingSecret }}
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKeys.jwtSecret }}
                  {{- else }}
                  name: {{ include "mdnest.appSecretName" . }}
                  key: MDNEST_JWT_SECRET
                  {{- end }}
            {{- if eq .Values.auth.mode "multi" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.existingSecret }}
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKeys.password }}
                  {{- else }}
                  name: {{ include "mdnest.appSecretName" . }}
                  key: POSTGRES_PASSWORD
                  {{- end }}
            {{- end }}
            {{- if and .Values.collab.enabled .Values.collab.redis.host }}
            # Compose mode: read the password from an external Secret (e.g. the
            # KubeBlocks account Secret) and build REDIS_URL at runtime. K8s
            # expands $(REDIS_PASSWORD) because it is declared earlier in this
            # same container's env list.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "collab.redis.passwordSecret.name is required when collab.redis.host is set" .Values.collab.redis.passwordSecret.name }}
                  key: {{ .Values.collab.redis.passwordSecret.key }}
            - name: REDIS_URL
              value: {{ printf "%s://%s:$(REDIS_PASSWORD)@%s:%v/%v" (ternary "rediss" "redis" .Values.collab.redis.tls) .Values.collab.redis.username .Values.collab.redis.host .Values.collab.redis.port .Values.collab.redis.database | quote }}
            {{- else if and .Values.collab.enabled (or .Values.collab.redis.url .Values.collab.redis.existingSecret) }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.collab.redis.existingSecret }}
                  name: {{ .Values.collab.redis.existingSecret }}
                  key: {{ .Values.collab.redis.secretKeys.url }}
                  {{- else }}
                  name: {{ include "mdnest.appSecretName" . }}
                  key: REDIS_URL
                  {{- end }}
            {{- end }}
            {{- if .Values.sso.enabled }}
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.sso.existingSecret }}
                  name: {{ .Values.sso.existingSecret }}
                  key: {{ .Values.sso.secretKeys.clientSecret }}
                  {{- else }}
                  name: {{ include "mdnest.appSecretName" . }}
                  key: SSO_CLIENT_SECRET
                  {{- end }}
            {{- end }}
            {{- if eq .Values.storage.backend "s3" }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.storage.s3.existingSecret }}
                  name: {{ .Values.storage.s3.existingSecret }}
                  key: {{ .Values.storage.s3.secretKeys.accessKey }}
                  {{- else }}
                  name: {{ include "mdnest.appSecretName" . }}
                  key: S3_ACCESS_KEY
                  {{- end }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.storage.s3.existingSecret }}
                  name: {{ .Values.storage.s3.existingSecret }}
                  key: {{ .Values.storage.s3.secretKeys.secretKey }}
                  {{- else }}
                  name: {{ include "mdnest.appSecretName" . }}
                  key: S3_SECRET_KEY
                  {{- end }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: notes
              mountPath: /data/notes
            - name: secrets
              mountPath: /data/secrets
      volumes:
        - name: notes
          {{- if .Values.persistence.notes.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mdnest.notesClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: secrets
          {{- if .Values.persistence.secrets.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mdnest.secretsClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
