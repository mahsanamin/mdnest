# Headless service governing the backend StatefulSet's stable pod network IDs.
# /api traffic uses the regular ClusterIP service (backend-service.yaml); this
# one only provides the per-pod DNS the StatefulSet requires.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mdnest.backend.headlessName" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mdnest.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
