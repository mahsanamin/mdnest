{{- include "mdnest.validateSupported" . -}}
{{- include "mdnest.validateHA" . -}}
{{- include "mdnest.validateUpgrade" . -}}
{{- if ne (include "mdnest.gitNativeHA" .) "true" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mdnest.backend.fullname" . }}
  labels:
    {{- include "mdnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "mdnest.backend.headlessName" . }}
  podManagementPolicy: {{ .Values.backend.podManagementPolicy }}
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  updateStrategy:
    {{- toYaml .Values.backend.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "mdnest.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mdnest.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mdnest.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.namespaces }}
      initContainers:
        # Ensure the configured top-level namespaces (note folders) exist under
        # /data/notes. Idempotent and self-healing on every (re)start. When the
        # list is empty (default) this init container is not rendered, so the
        # existing behavior is unchanged.
        - name: provision-namespaces
          image: {{ $.Values.backend.namespaceInitImage }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              for ns in {{ range . }}{{ . | quote }} {{ end }}; do
                echo "ensuring namespace: ${ns}"
                mkdir -p "/data/notes/${ns}"
              done
          {{- with $.Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: notes
              mountPath: /data/notes
      {{- end }}
      containers:
        - name: backend
          image: {{ include "mdnest.backend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "mdnest.envConfigName" . }}
          env:
            {{- include "mdnest.backend.secretEnv" . | nindent 12 }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: notes
              mountPath: /data/notes
            - name: secrets
              mountPath: /data/secrets
            {{- if and (eq .Values.storage.backend "git") .Values.storage.git.remote.url .Values.storage.git.remote.existingTokenSecret }}
            - name: git-token
              mountPath: /etc/mdnest/git
              readOnly: true
            {{- end }}
      volumes:
        # notes/secrets are provided by the volumeClaimTemplates below when
        # managed per-pod. They only appear here when shared (existingClaim) or
        # ephemeral (persistence disabled -> emptyDir).
        {{- if or .Values.persistence.notes.existingClaim (not .Values.persistence.notes.enabled) }}
        - name: notes
          {{- if .Values.persistence.notes.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.notes.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if or .Values.persistence.secrets.existingClaim (not .Values.persistence.secrets.enabled) }}
        - name: secrets
          {{- if .Values.persistence.secrets.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.secrets.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if and (eq .Values.storage.backend "git") .Values.storage.git.remote.url .Values.storage.git.remote.existingTokenSecret }}
        - name: git-token
          secret:
            secretName: {{ .Values.storage.git.remote.existingTokenSecret }}
            items:
              - key: {{ .Values.storage.git.remote.tokenSecretKey }}
                path: token
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if or (and .Values.persistence.notes.enabled (not .Values.persistence.notes.existingClaim)) (and .Values.persistence.secrets.enabled (not .Values.persistence.secrets.existingClaim)) }}
  # Per-pod volumes managed by the StatefulSet: their PVC lifecycle is owned by
  # the workload (created/named/attached per replica), so there is no orphaned
  # PVC referenced from outside its owner. Shared storage instead uses
  # persistence.*.existingClaim (a claim you provision); a disabled volume uses
  # an emptyDir.
  volumeClaimTemplates:
    # volumeClaimTemplates is an immutable part of the StatefulSet spec, so it
    # must carry only STABLE labels. mdnest.labels includes helm.sh/chart and
    # app.kubernetes.io/version, which change on every release and would make
    # each upgrade an illegal update to an immutable field (server-side-apply
    # dry-run then fails and stalls Argo). selectorLabels are release-invariant.
    {{- if and .Values.persistence.notes.enabled (not .Values.persistence.notes.existingClaim) }}
    - metadata:
        name: notes
        labels:
          {{- include "mdnest.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: notes
        {{- with (merge (dict) .Values.persistence.notes.annotations .Values.commonAnnotations) }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.notes.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.notes.size | quote }}
        {{- if .Values.persistence.notes.storageClass }}
        storageClassName: {{ .Values.persistence.notes.storageClass | quote }}
        {{- end }}
    {{- end }}
    {{- if and .Values.persistence.secrets.enabled (not .Values.persistence.secrets.existingClaim) }}
    - metadata:
        name: secrets
        labels:
          {{- include "mdnest.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: secrets
        {{- with (merge (dict) .Values.persistence.secrets.annotations .Values.commonAnnotations) }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.secrets.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.secrets.size | quote }}
        {{- if .Values.persistence.secrets.storageClass }}
        storageClassName: {{ .Values.persistence.secrets.storageClass | quote }}
        {{- end }}
    {{- end }}
  {{- with .Values.persistence.pvcRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
