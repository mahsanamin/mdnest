# Default values for the mdnest chart.
# -----------------------------------------------------------------------------
# Deployment model
# -----------------------------------------------------------------------------
# By DEFAULT this chart deploys mdnest as a SINGLE instance (active/passive):
#   * backend is a StatefulSet, backend.replicaCount = 1
#   * notes/secrets use per-pod volumeClaimTemplates (ReadWriteOnce), whose PVC
#     lifecycle is owned by the StatefulSet (no orphaned, out-of-band PVC)
#   * AUTH_MODE=single, live collaboration and Redis disabled
# This matches mdnest's out-of-the-box behavior exactly.
#
# Horizontal scaling (active/active) is OPT-IN. To enable it you MUST:
#   1. Set auth.mode=multi and provide an external PostgreSQL (postgres.*).
#   2. Enable collaboration: collab.enabled=true.
#   3. Provide an external Redis and set collab.redis.url (or redis secret).
#   4. Provide SHARED storage via persistence.notes.existingClaim AND
#      persistence.secrets.existingClaim (ReadWriteMany PVCs every replica
#      mounts) so all pods share the same files. A per-pod volumeClaimTemplate
#      would diverge, so the chart rejects multi-replica without a shared claim.
#   5. Set backend.replicaCount > 1.
# The chart validates these invariants and fails fast with a clear message if a
# multi-replica deployment is missing Redis, collaboration, or a shared claim.
# -----------------------------------------------------------------------------

# -- Override the chart name portion of generated resource names.
nameOverride: ""
# -- Fully override the generated fullname used for all resources.
fullnameOverride: ""

# -- Labels added to every resource created by the chart.
commonLabels: {}
# -- Annotations added to every resource created by the chart.
commonAnnotations: {}

# -- Image pull secrets for private registries (list of `{name}`).
imagePullSecrets: []

serviceAccount:
  # -- Create a ServiceAccount for the workloads.
  create: true
  # -- Name of the ServiceAccount; generated when empty and `create=true`.
  name: ""
  # -- Annotations to add to the ServiceAccount.
  annotations: {}

image:
  # -- Image pull policy applied to all mdnest images.
  pullPolicy: IfNotPresent
  backend:
    # -- Backend image repository.
    repository: ghcr.io/mahsanamin/mdnest-backend
    # -- Backend image tag; defaults to `Chart.appVersion` when empty.
    tag: ""
  frontend:
    # -- Frontend image repository.
    repository: ghcr.io/mahsanamin/mdnest-frontend
    # -- Frontend image tag; defaults to `Chart.appVersion` when empty.
    tag: ""
  mcp:
    # -- MCP server image repository (used only when `mcp.enabled=true`).
    repository: ghcr.io/mahsanamin/mdnest-mcp-server
    # -- MCP server image tag; defaults to `Chart.appVersion` when empty.
    tag: ""

# -----------------------------------------------------------------------------
# Backend (Go API + WebSocket collaboration server, port 8080)
# -----------------------------------------------------------------------------
backend:
  # -- Number of backend replicas. Keep at `1` unless running active/active (see top-of-file notes).
  replicaCount: 1
  # -- StatefulSet pod management. `Parallel` starts/replaces pods together
  # (better for a stateless web tier); use `OrderedReady` for strict ordering.
  podManagementPolicy: Parallel
  updateStrategy:
    # -- StatefulSet update strategy. `RollingUpdate` is safe because each pod
    # owns its own volume (volumeClaimTemplate) — no ReadWriteOnce hand-off
    # deadlock, so the old Deployment `Recreate` workaround is gone.
    type: RollingUpdate
  # -- Public origin the browser uses to reach mdnest (CORS + SSO redirect URL). Set to your ingress URL in production.
  frontendOrigin: "http://localhost"
  # -- Optional display alias shown in the UI (`SERVER_ALIAS`).
  serverAlias: ""
  # -- Disable the periodic GitHub release update check (`DISABLE_UPDATE_CHECK`).
  disableUpdateCheck: false
  # -- Extra backend environment variables (list of `{name,value}` or `{name,valueFrom}`).
  extraEnv: []
  # -- Top-level namespaces to ensure exist under `/data/notes` on startup (idempotent init container). Empty disables it. Names must not contain `/` or `\` nor start with `.`.
  namespaces: []
  # -- Image used by the namespace-provisioning init container.
  namespaceInitImage: busybox:1.36
  # -- Extra pod annotations for the backend.
  podAnnotations: {}
  # -- Extra pod labels for the backend.
  podLabels: {}
  # -- Pod-level security context for the backend.
  podSecurityContext:
    runAsNonRoot: false
  # -- Container-level security context for the backend.
  securityContext: {}
  # -- Backend resource requests/limits.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  # -- Node selector for the backend.
  nodeSelector: {}
  # -- Tolerations for the backend.
  tolerations: []
  # -- Affinity rules for the backend.
  affinity: {}
  # -- Liveness probe (hits the unauthenticated `GET /api/config`).
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Readiness probe (hits the unauthenticated `GET /api/config`).
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  service:
    # -- Backend Service type.
    type: ClusterIP
    # -- Backend Service port.
    port: 8080
  # -- Optional HorizontalPodAutoscaler (active/active only — requires RWX storage + Redis).
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: ""

# -----------------------------------------------------------------------------
# Frontend (nginx static SPA that reverse-proxies /api and /api/ws to backend)
# -----------------------------------------------------------------------------
frontend:
  # -- Number of frontend (nginx) replicas.
  replicaCount: 1
  # -- Extra pod annotations for the frontend.
  podAnnotations: {}
  # -- Extra pod labels for the frontend.
  podLabels: {}
  # -- Pod-level security context for the frontend.
  podSecurityContext: {}
  # -- Container-level security context for the frontend.
  securityContext: {}
  # -- Frontend resource requests/limits.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 128Mi
  # -- Node selector for the frontend.
  nodeSelector: {}
  # -- Tolerations for the frontend.
  tolerations: []
  # -- Affinity rules for the frontend.
  affinity: {}
  service:
    # -- Frontend Service type.
    type: ClusterIP
    # -- Frontend Service port.
    port: 80
  # -- WebSocket proxy read/send timeout (seconds); keep long for live collaboration.
  wsTimeoutSeconds: 86400
  # -- Extra nginx env vars. Set `NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE=1` with a CPU limit to avoid nginx spawning one worker per host CPU (OOM risk).
  env: []

# -----------------------------------------------------------------------------
# Authentication mode
#   single = file-based auth, no database (default, matches upstream default)
#   multi  = multi-user mode backed by external PostgreSQL (required for HA)
# -----------------------------------------------------------------------------
auth:
  # -- Authentication mode: `single` (file-based, no DB) or `multi` (PostgreSQL-backed, required for HA).
  mode: single
  # -- Bootstrap admin username for single mode (`MDNEST_USER`). Ignored in multi mode.
  adminUser: admin
  # -- Existing Secret holding credentials. When set, the chart-managed Secret is not created and inline values are ignored.
  existingSecret: ""
  # -- Keys expected inside `existingSecret`.
  secretKeys:
    password: MDNEST_PASSWORD
    jwtSecret: MDNEST_JWT_SECRET
  # -- Inline admin password (used only when `existingSecret` is empty). CHANGE THIS.
  password: ""
  # -- Inline JWT signing secret (used only when `existingSecret` is empty). CHANGE THIS.
  jwtSecret: ""

# -----------------------------------------------------------------------------
# External PostgreSQL (required when auth.mode=multi). NOT bundled — point this
# at a managed / external HA Postgres.
# -----------------------------------------------------------------------------
postgres:
  # -- PostgreSQL host (required when `auth.mode=multi`).
  host: ""
  # -- PostgreSQL port.
  port: 5432
  # -- PostgreSQL database name.
  database: mdnest
  # -- PostgreSQL user.
  user: mdnest
  # -- Existing Secret holding the Postgres password (preferred over inline).
  existingSecret: ""
  # -- Key inside `existingSecret` holding the password.
  secretKeys:
    password: POSTGRES_PASSWORD
  # -- Inline Postgres password (discouraged; used only when `existingSecret` is empty).
  password: ""

# -----------------------------------------------------------------------------
# Live collaboration + optional Redis backplane (opt-in horizontal scaling).
#   collab.enabled       -> ENABLE_LIVE_COLLAB=true (requires auth.mode=multi)
#   collab.redis.url     -> REDIS_URL; when set, presence/events sync across
#                           replicas (active/active). Empty = single instance.
# -----------------------------------------------------------------------------
#
# Live collaboration (collab.enabled) works on a single backend replica. To run
# multiple replicas (active/active), also set a Redis backplane below so presence
# and edits sync across pods — validateHA enforces this, since without it
# replicas would silently diverge.
#
# DURABILITY NOTE: with the git-native HA backend (storage.backend=git +
# REDIS_URL) this same Redis is NOT just a presence/event backplane — it also
# carries the durability queue between the app replicas and the writer. Between
# a save's ack and the writer committing it to git, the queue is the only copy,
# so this Redis must run with AOF persistence (appendonly yes). See
# docs/kubernetes.md "Git-native HA and durability (RPO)".
collab:
  # -- Enable live collaboration (`ENABLE_LIVE_COLLAB`; requires `auth.mode=multi`). For multiple replicas, also configure `redis` below.
  enabled: false
  redis:
    # -- Full Redis URL (`redis://` / `rediss://`) -> `REDIS_URL`. When set, presence/events sync across replicas (active/active); empty = single instance.
    url: ""
    # -- Existing Secret to source `REDIS_URL` from instead of inline `url`.
    existingSecret: ""
    # -- Key inside `existingSecret` holding the URL.
    secretKeys:
      url: REDIS_URL
    # -- Compose mode: when set, the chart BUILDS `REDIS_URL` from discrete parts and reads the password from `passwordSecret`. Takes precedence over `url`/`existingSecret`. Use with managed Redis (KubeBlocks, ElastiCache).
    host: ""
    # -- Redis port (compose mode).
    port: 6379
    # -- Redis username (compose mode).
    username: default
    # -- Redis database index (compose mode).
    database: 0
    # -- Use TLS (`rediss://`) in compose mode.
    tls: false
    # -- Secret holding the Redis password in compose mode.
    passwordSecret:
      name: ""
      key: password

# -----------------------------------------------------------------------------
# Task board (opt-in). Projects the `- [ ]` checkboxes in your notes into a
# per-namespace kanban board. Off by default and independent of `auth.mode`;
# when off the `/api/tasks` and `/api/board` routes are not registered and the
# UI chunk is never loaded.
# -----------------------------------------------------------------------------
taskBoard:
  # -- Enable the task board (`ENABLE_TASK_BOARD`). Off by default; projects note checkboxes into a per-namespace kanban. Independent of `auth.mode`.
  enabled: false

# -----------------------------------------------------------------------------
# Marp slides (optional). When enabled, a note whose frontmatter declares
# `marp: true` is rendered as a slide deck in the Live view instead of the
# editor. Off by default; when off the frontend never loads the Marp engine
# chunk. Independent of `auth.mode`.
# -----------------------------------------------------------------------------
marp:
  # -- Enable Marp slide rendering (`ENABLE_MARP`). Off by default; renders `marp: true` notes as a slide deck in the Live view. Independent of `auth.mode`.
  enabled: false
  themes:
    # -- Enable the centralized Marp theme catalog + superadmin editor (`ENABLE_MARP_THEMES`). A separate opt-in on top of `marp.enabled`. Off by default; when off the theme routes are not registered, nothing is seeded, and the admin tab is hidden. Themes live in a reserved, hidden namespace (never mirrored to a git remote).
    enabled: false

# -----------------------------------------------------------------------------
# Excalidraw drawings (optional). `.excalidraw.md` files open in a drawing
# editor; the markdown file stays the source of truth. Independent of
# `auth.mode`.
# -----------------------------------------------------------------------------
excalidraw:
  # -- Enable the Excalidraw drawing editor (`ENABLE_EXCALIDRAW`). Off by default; when off `.excalidraw.md` files open as plain text and the (large) editor chunk is never loaded.
  enabled: false

# -----------------------------------------------------------------------------
# SSO / OIDC (optional). Only rendered when sso.enabled=true.
# -----------------------------------------------------------------------------
sso:
  # -- Enable SSO/OIDC login (`USER_PROVIDER=sso`; otherwise `local`).
  enabled: false
  # -- OIDC issuer URL.
  issuerUrl: ""
  # -- OIDC client ID.
  clientId: ""
  # -- OAuth redirect URL; defaults to `<frontendOrigin>/api/auth/sso/callback`.
  redirectUrl: ""
  # -- Comma-separated list of allowed email domains.
  allowedDomains: ""
  # -- Label shown on the SSO login button.
  providerLabel: "SSO"
  # -- Comma-separated emails auto-promoted to superadmin.
  adminEmails: ""
  # -- Opt-in: auto-create a least-privilege collaborator for an unknown but
  # IdP-authenticated email on first login, instead of rejecting it. Off by
  # default. Enable only when the IdP itself gates who may obtain a token
  # (e.g. a domain-restricted enterprise IdP); pair with `allowedDomains`.
  autoProvisionUsers: false
  # -- Existing Secret holding the OIDC client secret (preferred over inline).
  existingSecret: ""
  # -- Key inside `existingSecret` holding the client secret.
  secretKeys:
    clientSecret: SSO_CLIENT_SECRET
  # -- Inline OIDC client secret (used only when `existingSecret` is empty).
  clientSecret: ""

# -----------------------------------------------------------------------------
# Storage backend for note data.
#   local (default) = notes live on the `notes` PVC (filesystem). Behaviour is
#                     byte-identical to upstream.
#   git             = same on-disk layout, but mdnest owns per-namespace git
#                     history in-process, so no git-sync sidecar is needed for
#                     local history. Add REDIS_URL for the git-native HA
#                     topology (stateless app replicas + a single durability
#                     writer) — see docs/kubernetes.md.
# The git-sync sidecar (gitSync.*) is a separate, optional mirror and is
# mutually exclusive with the `git` backend (both commit to the working tree).
# -----------------------------------------------------------------------------
storage:
  # -- Note storage backend: `local` (notes on the volume) or `git` (same, plus
  # mdnest maintains per-namespace git history in-process — no git-sync sidecar
  # needed for local history; add REDIS_URL for the git-native HA topology). Any
  # other value is rejected at install time.
  backend: local
  git:
    # -- Git history is committed per-namespace once the writer goes idle on it,
    # not on a fixed timer: an editing session (many rapid saves) is coalesced
    # into a single commit made after `commit.debounce` with no new write, so
    # the git graph stays readable. Note bytes are durable on disk immediately;
    # this only controls history commit cadence.
    commit:
      # -- Commit a namespace after this long with no new write (Go duration).
      # Empty = backend default (2m).
      debounce: ""
      # -- Safety cap: force a commit once a namespace has been dirty this long
      # even while still being edited (Go duration). Empty = backend default
      # (10m).
      maxWait: ""
    # -- Author name/email for mdnest's own commits. Empty = mdnest/mdnest@localhost.
    authorName: ""
    authorEmail: ""
    # -- Optional per-namespace remote mirror: one git repository per workspace,
    # pushed over HTTPS. When `url` is set the git backend pushes each namespace
    # repo to `<url>/<namespace>.git`. Opt-in; empty = local history only. This
    # is the coarse global default; per-workspace remotes (multi mode) are a
    # separate feature.
    remote:
      # -- Base URL for the per-namespace remotes, e.g. `https://gitlab.example.com/notes-workspaces`. Empty = mirroring disabled.
      url: ""
      # -- HTTPS username (GitLab PAT: `oauth2`; GitHub PAT: `x-access-token`).
      username: oauth2
      # -- Branch to push.
      branch: main
      # -- Existing Secret holding the Personal Access Token, mounted read-only as a file. Create it yourself; tokens must never live in values.
      existingTokenSecret: ""
      # -- Key inside `existingTokenSecret` holding the PAT.
      tokenSecretKey: token

# -----------------------------------------------------------------------------
# Persistence. The backend is a StatefulSet, so each volume has three modes:
#   - existingClaim set  -> a shared PVC you provision (required for active/active
#     and for git-sync, which both need all pods to see the same repository);
#   - enabled, no existingClaim -> a per-pod volumeClaimTemplate the StatefulSet
#     owns (clean PVC lifecycle, no orphan; the single-box default);
#   - disabled -> an emptyDir (ephemeral).
# notes = the Markdown repository (shared with git-sync); secrets = the local
# API-token store (unused in multi mode, where tokens live in PostgreSQL).
#
# UPGRADING chart 0.1.0 -> 0.2.0 (Deployment -> StatefulSet): the old
# Helm-managed `<release>-notes` PVC is removed and the StatefulSet provisions a
# fresh, empty per-pod volume. To keep existing notes, set
# `persistence.notes.existingClaim: <release>-notes` so the volume is adopted.
# Fresh installs need nothing. (This applies to any deploy path — the NOTES.txt
# hint only shows on `helm install/upgrade`, not under `helm template`/GitOps.)
# -----------------------------------------------------------------------------
persistence:
  # -- Retention policy for volumeClaimTemplate PVCs (Kubernetes >= 1.27). Lets
  # the StatefulSet delete or retain per-pod PVCs on scale-down/delete, so their
  # lifecycle is controlled rather than orphaned. Leave empty for the cluster
  # default (Retain). Example: {whenDeleted: Delete, whenScaled: Retain}.
  pvcRetentionPolicy: {}
  notes:
    # -- Provision a PVC for note data.
    enabled: true
    # -- Use an existing (shared) PVC instead of a per-pod volumeClaimTemplate.
    # Required for active/active and for git-sync.
    existingClaim: ""
    # -- StorageClass for the notes PVC (empty = cluster default).
    storageClass: ""
    # -- Access mode for the per-pod volumeClaimTemplate. ReadWriteOnce is fine
    # (each pod owns its volume). Sharing across pods uses existingClaim instead.
    accessMode: ReadWriteOnce
    # -- Notes PVC size.
    size: 5Gi
    # -- Annotations for the notes PVC.
    annotations: {}
  secrets:
    # -- Provision a PVC for the API-token/secrets store. In multi mode API
    # tokens live in PostgreSQL, so this PVC is unused and can be disabled
    # (falls back to an emptyDir) — that is what removes the last
    # ReadWriteMany requirement for active/active. Existing multi-mode installs
    # keep their tokens: on first start the backend imports tokens.json into
    # Postgres, so upgrade with this still enabled once, then disable it.
    # Single mode still uses it for the file-based token store.
    enabled: true
    # -- Use an existing PVC instead of creating one.
    existingClaim: ""
    # -- StorageClass for the secrets PVC (empty = cluster default).
    storageClass: ""
    # -- Access mode. No longer required to be ReadWriteMany for active/active
    # (multi-mode tokens are in Postgres); set persistence.secrets.enabled=false
    # instead of provisioning RWX.
    accessMode: ReadWriteOnce
    # -- Secrets PVC size.
    size: 256Mi
    # -- Annotations for the secrets PVC.
    annotations: {}

# -----------------------------------------------------------------------------
# Durability writer (git-native HA only). Rendered when storage.backend=git and
# the backend is scaled past one replica (or autoscaled): a single-replica
# StatefulSet that owns the authoritative git tree, wins the Redis leader lock,
# drains the durability queue, and mirrors to the remote. Its notes PVC reuses
# persistence.notes (size/storageClass/accessMode); only sizing/scheduling here.
# -----------------------------------------------------------------------------
writer:
  # -- Writer resource requests/limits.
  resources: {}
  # -- Node selector for the writer pod.
  nodeSelector: {}
  # -- Tolerations for the writer pod.
  tolerations: []
  # -- Affinity rules for the writer pod.
  affinity: {}

# -----------------------------------------------------------------------------
# git-sync sidecar (optional). Periodically commits/pushes the notes repo to a
# git remote, mirroring the upstream git-sync container. Runs as a SINGLE
# replica (a git working tree has one writer) even in active/active.
# -----------------------------------------------------------------------------
gitSync:
  # -- Enable the git-sync sidecar (mirrors the notes repo to a git remote).
  enabled: false
  # -- git-sync sidecar image.
  image:
    repository: alpine/git
    tag: latest
    pullPolicy: IfNotPresent
  # -- Commit/push interval in seconds.
  intervalSeconds: 600
  # -- Git commit author identity.
  author:
    name: "mdnest"
    email: "mdnest@example.com"
  # -- Name of a Secret with SSH deploy key(s), mounted read-only at `/keys`. Create it yourself; keys must never live in values.
  sshSecretName: ""
  # -- git-sync resource requests/limits.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  # -- Node selector for git-sync.
  nodeSelector: {}
  # -- Tolerations for git-sync.
  tolerations: []
  # -- Affinity rules for git-sync.
  affinity: {}

# -----------------------------------------------------------------------------
# Ingress. Routes all traffic to the frontend service, which reverse-proxies
# /api and /api/ws to the backend (same model as the upstream Caddy/compose
# setup). WebSocket upgrades pass through nginx.
# -----------------------------------------------------------------------------
ingress:
  # -- Enable an Ingress routing all traffic to the frontend Service.
  enabled: false
  # -- IngressClass name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hosts and paths.
  hosts:
    - host: mdnest.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration.
  tls: []

# -- Optional PodDisruptionBudget (useful for active/active).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# -----------------------------------------------------------------------------
# MCP server (opt-in). Exposes mdnest over the Model Context Protocol using the
# streamable-HTTP transport. DISABLED by default: when mcp.enabled is false no
# extra resources are rendered and the deployment is unchanged. When enabled it
# adds a Deployment + Service (and optional Ingress) running the mdnest-mcp-server
# image, which talks to the backend API in-cluster with a service API token.
# -----------------------------------------------------------------------------
mcp:
  # -- Enable the MCP server over streamable-HTTP.
  enabled: false
  # -- Number of MCP server replicas.
  replicaCount: 1
  # -- URL the MCP server uses to reach the backend API; defaults to the in-cluster backend Service when empty.
  mdnestUrl: ""
  # -- Endpoint authentication. Mutually exclusive modes selected by `auth.mode`:
  #    `bearer` — clients present a static mdnest API token (service / gateway
  #      integration). The token is required in the endpoint's `Authorization:
  #      Bearer` header and forwarded to the backend. Provide it inline via
  #      `auth.token` or reference an existing Secret (`auth.existingSecret`).
  #    `oauth`  — per-user delegation via OAuth 2.1 authorization-code + PKCE;
  #      login is delegated to mdnest SSO and every action is attributed to the
  #      signed-in user. Requires the `oauth.*` settings below.
  auth:
    mode: bearer
    # -- bearer mode: static mdnest API token. Provide inline via `auth.token`
    #    or reference an existing Secret.
    token: ""
    existingSecret: ""
    existingSecretKey: token
  # -- oauth mode settings (used only when `auth.mode=oauth`).
  oauth:
    # -- Public HTTPS base URL clients reach the MCP server on (no trailing slash).
    publicUrl: ""
    # -- mdnest backend SSO start endpoint, e.g. `https://<host>/api/auth/sso/start`.
    ssoAuthorizeUrl: ""
    # -- Origins allowed to receive an OAuth authorization code, in addition
    # to loopback. Loopback (127.0.0.1 / localhost) is always permitted, which
    # covers native MCP clients. An authorization code carries a live mdnest
    # token, so any other origin must be listed here explicitly or it is
    # refused. Leave empty unless a hosted client on a real domain needs it.
    allowedRedirectOrigins: []
    # -- HMAC secret signing OAuth cookies/codes. Provide inline via `secret.value` or reference an existing Secret.
    secret:
      value: ""
      existingSecret: ""
      existingSecretKey: oauth-secret
  # -- MCP HTTP listen port and path.
  http:
    port: 3000
    path: /mcp
  # -- MCP Service type/port.
  service:
    type: ClusterIP
    port: 3000
  # -- Extra environment variables appended to the MCP container.
  extraEnv: []
  # -- MCP resource requests/limits.
  resources: {}
  # -- Extra pod annotations for the MCP server.
  podAnnotations: {}
  # -- Extra pod labels for the MCP server.
  podLabels: {}
  # -- Pod-level security context for the MCP server.
  podSecurityContext: {}
  # -- Container-level security context for the MCP server.
  securityContext: {}
  # -- Node selector for the MCP server.
  nodeSelector: {}
  # -- Tolerations for the MCP server.
  tolerations: []
  # -- Affinity rules for the MCP server.
  affinity: {}
  # -- Optional standard Ingress for the MCP endpoint (leave disabled if your cluster exposes it through its own ingress controller, e.g. a Traefik IngressRoute defined at the umbrella-chart level).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
