apiVersion: v2
name: mdnest
description: |
  mdnest — self-hosted Markdown knowledge base with live collaboration.
  Standard-Kubernetes chart (no CRDs). PostgreSQL and Redis are expected to be
  provided externally. Defaults to a single-instance (active/passive)
  deployment; horizontal scaling (active/active) is strictly opt-in.
type: application

# Chart version — bump on chart changes (SemVer).
version: 0.1.0

# Version of mdnest this chart deploys by default (image tag fallback).
appVersion: "3.11.6"

home: https://github.com/forterro/mdnest
sources:
  - https://github.com/forterro/mdnest

maintainers:
  - name: Forterro IT Operations

keywords:
  - markdown
  - notes
  - knowledge-base
  - collaboration
