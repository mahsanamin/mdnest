apiVersion: v2
name: mdnest
description: |
  mdnest — self-hosted Markdown knowledge base with live collaboration.
  Standard-Kubernetes chart (no CRDs). PostgreSQL and Redis are expected to be
  provided externally. Defaults to a single-instance (active/passive)
  deployment; horizontal scaling (active/active) is strictly opt-in.
type: application

# Chart version — bump on chart changes (SemVer).
version: 0.4.0

# Version of mdnest this chart deploys by default (image tag fallback).
# Tracks the same version as backend/handlers/config.go, frontend/package.json
# and the mdnest CLI — carries the -dev suffix on develop, plain X.Y.Z on a
# release branch. The release workflow also passes --app-version at package
# time, so a published chart is stamped from the tag regardless.
appVersion: "4.4.0-dev"

home: https://github.com/mahsanamin/mdnest
sources:
  - https://github.com/mahsanamin/mdnest

maintainers:
  - name: mdnest
    url: https://github.com/mahsanamin/mdnest

keywords:
  - markdown
  - notes
  - knowledge-base
  - collaboration
