server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ws {
        proxy_pass http://backend:8080/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML — never cache (so browser always discovers new JS/CSS hashes)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Build assets are content-hashed and immutable, and must NEVER fall back
    # to index.html. A tab loaded before a redeploy asks for a hash that no
    # longer exists; the SPA fallback answered with index.html and a 200, so the
    # browser tried to parse HTML as an ES module. The app then broke in a
    # confusing half-alive way instead of failing cleanly, and a cache-busting
    # retry couldn't help because the server kept returning HTML. A 404 is the
    # truth, and it lets the app's chunk-error boundary tell the user to reload.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The CLI and its installer (/cli/mdnest, /cli/install.sh). Public on
    # purpose: people fetch them before they have a token, and they hold no
    # secrets. A miss is a 404, never the SPA's index.html, which the CLI's
    # own check would reject anyway but which reads as a confusing error.
    location /cli/ {
        try_files $uri =404;
        default_type text/plain;
        types { }
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
