name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  frontend:
    name: Frontend (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci
      - run: cd frontend && npm audit --audit-level=high

  mcp-server:
    name: MCP Server (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd mcp-server && npm ci
      - run: cd mcp-server && npm audit --audit-level=high

  backend:
    name: Backend (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Track go.mod's `go` directive automatically so this stays
          # in sync with the production Docker image's golang base.
          # Without go-version-file, we'd have to manually bump this
          # alongside every Go version change in the Dockerfile.
          go-version-file: 'backend/go.mod'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: cd backend && govulncheck ./...

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # Severity: `error` only. The codebase currently has a handful
        # of `warning` and `info`-level findings (unused-var hints,
        # quote suggestions) that are worth addressing in follow-up
        # but aren't security-relevant. Bump severity here when those
        # are cleaned up.
        run: |
          shellcheck --version
          shellcheck -S error \
            setup.sh \
            mdnest-server \
            mdnest \
            git-sync/sync.sh \
            install-cli.sh \
            .githooks/pre-push
