name: CI

# Build and test everything on every push/PR to main so integration of the
# security, HA, and Helm-chart work is continuously verified.
on:
  push:
    branches: [main, develop]
  pull_request:
    # `develop` is the integration branch, so PRs land there first — auditing
    # only `main` would mean CI never sees a change until the release PR.
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Stay in lockstep with the production Docker base image.
          go-version-file: 'backend/go.mod'
          cache-dependency-path: 'backend/go.sum'
      - name: Build
        run: cd backend && go build ./...
      - name: Vet
        run: cd backend && go vet ./...
      - name: Test (race)
        # ubuntu-latest ships gcc, so the race detector's cgo requirement is met.
        run: cd backend && go test -race -count=1 ./...

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - run: cd frontend && npm test

  mcp-server:
    name: MCP server (OAuth smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: cd mcp-server && npm ci
      - name: OAuth bridge smoke test
        # Spins a fake mdnest backend + the real mcp-server in oauth mode and
        # drives the full OAuth 2.1 authorization-code + PKCE flow end to end
        # (discovery, /authorize, SSO handoff, /finish, token exchange with
        # PKCE, and an authenticated MCP call). Exits non-zero on any failure.
        run: cd mcp-server && npm test

  helm:
    name: Helm chart (lint + render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint deploy/helm/mdnest
      - name: Render defaults (single instance)
        run: helm template ci deploy/helm/mdnest > /dev/null
      - name: Render the full supported configuration
        # Multi-mode + live collaboration + git-sync + active/active (three
        # backend replicas coordinated through the Redis backplane on
        # ReadWriteMany storage) + the MCP server with per-user OAuth. This is
        # the largest configuration the release implements, and CI proves it
        # renders.
        run: |
          helm template ci deploy/helm/mdnest \
            --set auth.mode=multi \
            --set postgres.host=pg.example \
            --set postgres.password=x \
            --set collab.enabled=true \
            --set collab.redis.url=redis://redis.example:6379/0 \
            --set backend.replicaCount=3 \
            --set persistence.notes.accessMode=ReadWriteMany \
            --set persistence.secrets.accessMode=ReadWriteMany \
            --set gitSync.enabled=true \
            --set gitSync.sshSecretName=keys \
            --set mcp.enabled=true \
            --set mcp.oauth.enabled=true \
            --set mcp.oauth.publicUrl=https://mcp.example \
            --set mcp.oauth.ssoAuthorizeUrl=https://notes.example/api/auth/sso/start \
            --set mcp.oauth.secret.value=ci-oauth-secret > rendered-ha.yaml
      - name: Reject options the code does not implement
        # The chart's values surface must not outrun the backend. Each option
        # here would otherwise deploy "healthy" while doing the wrong thing, so
        # the chart fails the install instead. When one of these capabilities
        # lands, move it into the render step above in the same change.
        run: |
          set -u
          fails=0
          expect_reject() {
            local desc="$1"; shift
            if helm template ci deploy/helm/mdnest "$@" >/dev/null 2>&1; then
              echo "::error::chart rendered '$desc', but this release cannot honour it"
              fails=$((fails + 1))
            else
              echo "ok: rejected $desc"
            fi
          }
          expect_reject "storage.backend=s3 (no object-store support)" \
            --set storage.backend=s3
          [ "$fails" -eq 0 ] || exit 1
      - name: Validate rendered manifests (kubeconform)
        # Pinned by digest, not :latest — an unpinned third-party image in CI
        # means an upstream push silently changes what runs in this repo.
        # Digest is kubeconform v0.8.0.
        uses: docker://ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          args: -strict -ignore-missing-schemas -summary rendered-ha.yaml

  images:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
