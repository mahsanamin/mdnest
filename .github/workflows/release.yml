name: Release

# Publish container images and the Helm chart on version tags (e.g. v3.11.7).
# Everything is parameterized by the repository OWNER so this workflow works
# unchanged on the upstream repo and on any fork — images and chart are
# published under ghcr.io/<owner>/ with no hardcoded organization.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without leading v, e.g. 3.11.7). Defaults to the tag.'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      # One image failing must not cancel the others mid-push, or a release ends
      # up with a partial set in the registry.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
          - name: mcp-server
            context: mcp-server
    steps:
      - uses: actions/checkout@v4
      - name: Compute build metadata
        id: prep
        # INPUT_VERSION is passed through env, never interpolated into the
        # script body — a ${{ }} expansion inside run: is a command-injection
        # sink, and this value reaches a shell and becomes an image tag.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Version comes from the tag on a tag push, or from the input on a
          # manual dispatch. Deriving it here (rather than relying on
          # metadata-action's type=semver, which only reads tag refs) is what
          # makes workflow_dispatch produce correctly-tagged images too.
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          # Validate before it becomes a registry tag; refuse anything that
          # isn't a plain version so a malformed dispatch can't publish junk.
          case "$version" in
            *[!0-9.a-zA-Z+-]*|'') echo "::error::refusing to publish version '$version'"; exit 1 ;;
          esac
          {
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "commit=${GITHUB_SHA::7}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$version"
            echo "minor=$(echo "$version" | cut -d. -f1-2)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner }}/mdnest-${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.prep.outputs.version }}
            type=raw,value=${{ steps.prep.outputs.minor }}
            type=raw,value=latest
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build args are consumed by the backend Dockerfile (ldflags) and
          # harmlessly ignored by the frontend.
          build-args: |
            GIT_COMMIT=${{ steps.prep.outputs.commit }}
            BUILD_TIME=${{ steps.prep.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - name: Compute chart metadata
        id: prep
        # Same as the images job: the dispatch input arrives via env, not a
        # ${{ }} expansion inside run:, and is validated before it becomes a
        # chart version.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            *[!0-9.a-zA-Z+-]*|'') echo "::error::refusing to publish chart version '$version'"; exit 1 ;;
          esac
          {
            echo "owner=$owner"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4
      - name: Point chart image repositories at this owner
        # Rewrites whatever owner values.yaml ships with, so a fork publishes its
        # own images. The previous form matched one hardcoded owner and became a
        # silent no-op once that default changed.
        env:
          OWNER: ${{ steps.prep.outputs.owner }}
        run: |
          sed -i -E "s#ghcr\\.io/[^/]+/(mdnest-[a-z-]+)#ghcr.io/$OWNER/\\1#g" \
            deploy/helm/mdnest/values.yaml
          grep -E 'repository: ghcr\.io' deploy/helm/mdnest/values.yaml
      - name: Package
        run: |
          helm package deploy/helm/mdnest \
            --version "${{ steps.prep.outputs.version }}" \
            --app-version "${{ steps.prep.outputs.version }}" \
            --destination dist
      - name: Log in to GHCR (OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push chart
        run: |
          helm push \
            "dist/mdnest-${{ steps.prep.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ steps.prep.outputs.owner }}/charts"
